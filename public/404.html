<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | CampusFind</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dark.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i data-lucide="compass"></i></div>
        <span>CampusFind</span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline btn-sm">Home</a>
      </div>
    </div>
  </header>

  <!-- 404 Content -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem;">
    <div style="text-align: center; max-width: 540px;">
      <div style="font-size: 6.5rem; font-family: var(--font-heading); font-weight: 800; line-height: 1; margin-bottom: 1rem;" class="gradient-text">
        404
      </div>
      <div style="width: 70px; height: 70px; border-radius: 50%; background: var(--lost-soft); color: var(--lost-color); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem;">
        <i data-lucide="compass"></i>
      </div>
      <h1 style="font-size: 2rem; margin-bottom: 0.75rem;">Looks like this page got lost too!</h1>
      <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.05rem;">
        We searched all college blocks, lecture halls, and laboratories, but couldn't find the page you were looking for.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-lg">
          <i data-lucide="home"></i> Back to Safety (Home)
        </a>
        <a href="items.html" class="btn btn-secondary btn-lg">
          <i data-lucide="grid"></i> Browse Items Feed
        </a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
